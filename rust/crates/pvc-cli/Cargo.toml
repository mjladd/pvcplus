[package]
name = "pvc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "pvc: a modern CLI for the PVCplus phase-vocoder toolkit."

[[bin]]
name = "pvc"
path = "src/main.rs"

[dependencies]
pvc-core = { path = "../pvc-core" }
pvc-io = { path = "../pvc-io" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
insta = "1"
