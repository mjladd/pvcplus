# Harness preset for `pvc tvfiltdeviator`. See harness/README.md.
# --filter-response needs a .pva file; the harness builds it from the
# same input audio via `pvc analyze` first (see PREREQS in run.py).
tool = "tvfiltdeviator"
input = "in.wav"
output = "out.wav"

[params]
filter_response = "filter.pva"
