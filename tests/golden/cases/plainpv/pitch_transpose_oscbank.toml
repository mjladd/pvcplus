tool = "plainpv"
input = "sine440_2s_44k.wav"
description = "pitch transpose forces the oscillator-bank path"
legacy_steps = [
    "plainpv -N2048 -P7 -t-60 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "-P7 makes ptrans.A[0] != 0, which switches plainpv to oscillator-bank resynthesis."
