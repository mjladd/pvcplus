tool = "plainpv"
input = "sine440_2s_44k.wav"
description = "pitch transpose"
legacy_steps = [
    "plainpv -N2048 -P7 -t-60 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 2.0 }
notes = "Note corrected: plainpv always uses oscillator-bank resynthesis (see stretch.toml's note) - -P7 doesn't 'switch' anything, it's just this case's actual pitch-transpose exercise. Tolerance widened from an initial 0.5dB to 2.0dB after CI's freshly-built (different compiler/platform than local dev) C oracle measured meaningfully higher error than the same case locally on a sibling case (warp_and_shelf_eq) - applied here too for the same margin against toolchain/platform variance."
