tool = "plainpv"
input = "stereo_two_tones_44k.wav"
description = "stereo input, default settings"
legacy_steps = [
    "plainpv -N1024 -I1.5 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "Exercises per-channel processing/channel-count handling. Tolerance switched from tight sample-level to spectral for the same reason as stretch.toml: oscillator-bank resynthesis has a real, expected precision ceiling above 1e-4 absolute sample error - here concentrated mostly near the tail (max ~0.046 in the last 10% of the file vs ~0.012 in the first 90%), consistent with small floating-point differences compounding over many frames rather than a structural bug."
