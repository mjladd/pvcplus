tool = "plainpv"
input = "sine440_2s_44k.wav"
description = "time stretch 2x"
legacy_steps = [
    "plainpv -N1024 -I2 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "Filename/note corrected: this does NOT use overlap-add. plainpv's obank selector (`phaseLockFlag == 1 || ptrans.n != 1 || ...`) is unconditionally true - phaseLockFlag is hardcoded to 1 and never set from any flag - confirmed against the real binary's own startup banner (\"USING OSCILLATOR BANK RESYNTHESIS\" prints regardless of -P/-a). Overlap-add is dead code in plainpv today; every case in this directory uses the oscillator bank. Tolerance switched from tight sample-level to spectral, matching the pitch cases: the oscillator bank's 8192-entry cosine table plus its own linear amp/freq interpolation is inherently noisier than overlap-add's FFT-based reconstruction (residual ~1e-3 range, not 1e-4) - a real, expected precision ceiling for this resynthesis path, not a porting bug (see docs/dev/rust-verification.md)."
