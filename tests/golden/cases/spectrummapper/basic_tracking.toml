tool = "spectrummapper"
input = "sine440_2s_44k.wav"
description = "spectrummapper: formant tracking of a 440Hz tone, high-freq-limit set explicitly to avoid the real C's own uninitialized-nyquist-default bug"
legacy_steps = [
    "spectrummapper -Ssegments.bin -a{output} -fscatter.txt -j8000 {input}",
]
output_ext = "txt"
tolerance = { kind = "numeric", max_abs_error = 0.001 }
notes = "spectrummapper writes no audio at all (outputoff=1 - see pvc-core::tools::spectrummapper's own doc comment), so {output} here is the ASCII frequency-segments plot file (-a), not audio. Two real, severe bugs in legacy/pvc_src/spectrummapper.c were fixed directly in the C source (matching this project's existing irconvolvesequencer.c precedent for genuine legacy crash bugs, not a throwaway local patch): (1) fclose(ifd) at the end of every successful run closed a global FILE* this tool never opens (a copy-paste leftover - see pv.h's own separate ifd/infile declarations), crashing before any output file was ever written, on every invocation; (2) the ASCII scatter-plot file (-f) was fopen()'d unconditionally and written to with no NULL check, crashing on the first found formant whenever -f was omitted despite being documented as optional - the -a (ASCII segments) file and its own internal 'intermediary' file have the identical unguarded-write pattern but were NOT fixed (same bug, not chased further - -a is always passed explicitly here and in this port's own CLI usage, sidestepping it without expanding scope). -j8000 avoids a third, separate uninitialized-default bug (highFreqLimit's own C initializer reads the not-yet-computed nyquist local) - see pvc-core::tools::spectrummapper's own doc comment on why the Rust port's CLI default resolves this properly instead.

The Rust golden harness (golden_spectrummapper.rs) does NOT use compare.py's exact-count numeric comparison against this recorded file - it compares only the first blank-line-delimited track directly, and explains why in its own doc comment. This file is still recorded (via the standard run_legacy.py workflow) for that first-track comparison and as a reference for anyone investigating the two known, narrow, boundary-adjacent discrepancies noted there: a near-silence candidate-detection instability at the very first analysis frame (confirmed present regardless of trim point or fixture fade design - tried a linear fade-out, a fade-in, and genuine silence padding, all either reproducing the same instability or making it dramatically worse via floor-level noise or NaN bandwidth/Q values elsewhere), and an occasional duplicate-segment artifact in the chain-linking output near a second, similarly boundary-adjacent group. Both were investigated at length - including direct internal-state comparison (accept/reject decision values, avgWinSize/centroidFreq intermediate computation) against a debug-instrumented rebuild of the real binary - and confirmed NOT to be a formula bug (every frame away from an input/trim boundary matches the oracle to 5-6 significant figures), but were not fully root-caused within a reasonable time budget. The tool's own default sensitivity (-A, minimum formant amplitude, default -96dB) also produces a large amount of inherently chaotic, near-noise-floor spectral-leakage 'formants' throughout ordinary FFT output that are unlikely to ever match exactly between independent implementations regardless of any fix here - real usage of this tool would set -A well above the floor (this port's own manual testing used -10 to -80dB) for exactly this reason."
