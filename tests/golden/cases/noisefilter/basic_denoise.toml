tool = "noisefilter"
input = "noise_then_tone_44k.wav"
description = "estimate noise from the lead-in, denoise the rest"
legacy_steps = [
    "noisefilter -B0 -E0.5 -F1 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "Input has 0.5s of noise-only lead-in (see fixtures/gen.sh); -B0 -E0.5 samples exactly that window. -F1 (peak method) added: the original version of this case used the default average method, but confirmed against the real binary, average-method formant detection finds zero formants for this whitenoise lead-in, which collapses the shared get_formants/NormalizeToPeaksOfSpectrumInBand machinery to an all-zero response ('ALL ZERO AMPLITUDES!' on stderr) and noisefilter then exits fatally ('NOISE SAMPLE HAS ZERO AMPLITUDE! BYE') before writing any output - a real quirk of the original tool for broadband noise input, not specific to this case's other flags. Peak method finds formants fine and produces real output."
