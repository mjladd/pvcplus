tool = "noisefilter"
input = "noise_then_tone_44k.wav"
description = "estimate noise from the lead-in, denoise the rest"
legacy_steps = [
    "noisefilter -B0 -E0.5 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "Input has 0.5s of noise-only lead-in (see fixtures/gen.sh); -B0 -E0.5 samples exactly that window."
