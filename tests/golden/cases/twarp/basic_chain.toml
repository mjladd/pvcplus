tool = "twarp"
input = "sine440_2s_44k.wav"
description = "pvanalysis -> twarp, constant-rate playback of the analysis"
legacy_steps = [
    "pvanalysis -N1024 {input} analysis.pva",
    "cp {input} {output}",
    "twarp -Fanalysis.pva -d2.0 {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "twarp always resynthesizes via the oscillator bank. It opens its output-file argument in SFM_READ first just to read a pre-set header format (sample rate/channels) - it never creates a file, so {output} has to already exist; the `cp` step supplies that template."
