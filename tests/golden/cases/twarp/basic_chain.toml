tool = "twarp"
input = "sine440_2s_44k.wav"
description = "pvanalysis -> twarp, constant-rate playback of the analysis"
legacy_steps = [
    "pvanalysis -N1024 {input} analysis.pva",
    "cp {input} {output}",
    "twarp -Fanalysis.pva -d2.0 {output}",
]
output_ext = "wav"
tolerance = { kind = "sample", max_abs_error = 0.002 }
notes = "Correction: twarp does NOT always resynthesize via the oscillator bank - unlike plainpv, its obank selector lacks plainpv's extra hardcoded phaseLockFlag==1 clause, so it genuinely takes the overlap-add path when -P/-a are both left at their zero defaults (confirmed via a debug build printing the resolved obank flag: 0 for this exact invocation, 1 once -P7 is added). This case exercises overlap-add, not the oscillator bank. See docs/dev/parameter-inventory.md §4. It opens its output-file argument in SFM_READ first just to read a pre-set header format (sample rate/channels) - it never creates a file, so {output} has to already exist; the `cp` step supplies that template. Tolerance kind is `sample` (absolute), not `spectral` (dB-relative): twarp's default rescale-to-analysis-peak behavior (see pvc-core::tools::twarp's doc comment - a confirmed real-tool quirk, not a porting bug) makes this whole file near-silent (peak 15/32768), where a dB-relative comparison blows up tiny absolute differences into huge numbers (one block goes from -180dB floor to a finite dB just from a handful of noise-floor-level samples). Max observed absolute error against the real oracle was ~21/32768 (~0.00064); 0.002 leaves margin for CI toolchain variance."
