tool = "twarp"
input = "sine440_2s_44k.wav"
description = "pvanalysis -> twarp with a 2x rate multiplier (time compression)"
legacy_steps = [
    "pvanalysis -N1024 {input} analysis.pva",
    "cp {input} {output}",
    "twarp -Fanalysis.pva -d1.0 -Y2.0 {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "-Y2.0 plays the analysis back at twice speed. twarp needs {output} to already exist (see basic_chain.toml's note); the `cp` step supplies that template."
