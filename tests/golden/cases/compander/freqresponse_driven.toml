tool = "compander"
input = "sine440_2s_44k.wav"
description = "freqresponse peaks feed compander's per-band companding"
legacy_steps = [
    "freqresponse -c1 {input} response.fr",
    "compander -Fresponse.fr -o-30 -O15 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "Exercises the freqresponse -> compander handoff (peak-picking analysis file format)."
