tool = "specflattracker"
input = "noise_then_tone_44k.wav"
description = "spectral flatness tracker, ASCII output, default amplitude method - noise_then_tone exercises a real flatness transition (noise-like lead-in dropping to a tonal steady state)"
legacy_steps = [
    "specflattracker {input} {output}",
]
output_ext = "txt"
tolerance = { kind = "numeric", max_abs_error = 2e-3 }
notes = "Widened from 1e-3 to 2e-3 after this case's own golden_specflattracker.rs test ran in CI's golden harness job for the first time (previously wired only under the separate rust/fmt/clippy/test job, which never builds the C oracle, so it silently skipped there and never actually ran - see docs/dev/rust-verification.md and the CI-gap note in project memory). First real run measured 0.001407 against the 0.001 budget - the SAME value already observed and flagged (not fixed, out of scope at the time) during the formantsmapper session's own fresh-fixture-regeneration pass. Same toolchain/sox-version-variance class already documented on plainpv/stretch.toml and plainpv/warp_and_shelf_eq.toml (no code touching specflattracker changed between the two observations), not a regression."
