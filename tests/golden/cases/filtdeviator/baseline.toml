tool = "filtdeviator"
input = "sine440_2s_44k.wav"
description = "chordresponsemaker synthesizes a response, filtdeviator applies it with every new subsystem (time delay, decay, frequency deviation) left at its default (inert) setting"
legacy_steps = [
    "chordresponsemaker -N1024 -f{input} -F{fixtures}/chord_table.txt response.fr",
    "filtdeviator -N1024 -Fresponse.fr {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "Baseline case: every filtdeviator-specific flag (time delay, decay time, frequency/amplitude deviation) is left at its default, under which each of those subsystems reduces to a no-op (confirmed by reading the formulas: fdevbase=fdevpeak=fshiftbase=fshiftpeak=0 makes the response-mode frequency deviation formula an identity; time-delay-base/peak=0 makes every bin's own delay exactly 0 frames). Exercises the shared groundwork (delay-ring plumbing, decay/feedback accumulator, EQ/warp pipeline) at its simplest setting before more targeted cases exercise each new subsystem with a real nonzero setting."
