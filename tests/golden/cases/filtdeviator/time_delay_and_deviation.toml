tool = "filtdeviator"
input = "sine440_2s_44k.wav"
description = "nonzero response-shaped time delay, decay/feedback, and response-mode frequency deviation together"
legacy_steps = [
    "chordresponsemaker -N1024 -f{input} -F{fixtures}/chord_table.txt response.fr",
    "filtdeviator -N1024 -Fresponse.fr -j0.02 -J0.08 -:0.02 -/0.05 -k-1 -K1 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "Exercises the three genuinely new subsystems together: -j/-J give each bin a response-shaped time delay between 0.02s and 0.08s into the filter's own delay line; -:/-/ give it a 0.02-0.05s decay time (the self-referential feedback accumulator - see pvc-core::tools::filtdeviator's doc comment); -k/-K deviate each bin's frequency by up to 1 semitone in either direction, response-shaped, which also selects oscillator-bank resynthesis. -q (time delay control) and -B (decay time control) are deliberately left unset: their real default is 1 (fully engaged), not the 0 the tool's own usage() text claims (see pvc-core::tools::filtdeviator's doc comment) - this case exercises that real default rather than passing -q1 -B1 explicitly. The decay time here is deliberately short (0.02-0.05s, not a more dramatic 0.2s+ tried during development): a longer decay rings the file's own tail down into true digital silence in both the oracle and this port, where oscillator-bank summation-order differences (see compare.py's own doc comment on why it has a spectral/RMS mode at all) turn a single near-zero sample into a huge dB ratio against a literal zero - confirmed directly during development by computing the oracle-vs-candidate dB difference per 1024-sample block across the whole file: a longer decay setting matched to within 0.2dB everywhere except the file's very last block, which was otherwise indistinguishable from silence in both. This shorter setting keeps the whole file away from that noise floor instead of papering over it with a wider tolerance."
