tool = "spectralextractor"
input = "noise_then_tone_44k.wav"
description = "spectralextractor: default periodic mode gates each bin on when its frame-to-frame frequency deviation stays under the threshold, separating the fixture's steady tone from its noisy lead-in"
legacy_steps = [
    "spectralextractor -q0 -Q30 -g0.05 -L0.05 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
