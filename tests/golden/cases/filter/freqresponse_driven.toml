tool = "filter"
input = "sine440_2s_44k.wav"
description = "freqresponse analysis feeds filter's response"
legacy_steps = [
    "freqresponse -c0 {input} response.fr",
    "filter -N1024 -Fresponse.fr -G1 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "-G1 = band-reject, using the analyzed (not synthesized) response."
