tool = "filter"
input = "sine440_2s_44k.wav"
description = "chordresponsemaker synthesizes a harmonic-tone response, filter applies it"
legacy_steps = [
    "chordresponsemaker -N1024 -f{input} -F{fixtures}/chord_table.txt response.fr",
    "filter -N1024 -Fresponse.fr {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "Core response-file format path: chordresponsemaker's multiple-harmonic-tone format. -f<soundfile> (undocumented in its own usage text - not listed there at all, despite being in crack()'s flag string) is what actually supplies the sample rate; -R is accepted by the parser but chordresponsemaker.c unconditionally opens -f's file via sf_open to read SR regardless of -R."
