tool = "filter"
input = "sine440_2s_44k.wav"
description = "filtresponsemaker synthesizes a response, filter applies it"
legacy_steps = [
    "filtresponsemaker -N1024 -F{fixtures}/filter_breakpoints.txt -f{input} response.fr",
    "filter -N1024 -Fresponse.fr {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "spectral", max_db_error = 0.5 }
notes = "Core response-file format path: filtresponsemaker's frequency-gradient format."
