tool = "inharmonator"
input = "sine440_2s_faded_44k.wav"
description = "inharmonator: three target partials (fundamental, ~2x, ~3x) remapped by fixed multipliers, no delay/decay, source mixed in at default gain"
legacy_steps = [
    "cp {input} {output}",
    "inharmonator -F{fixtures}/inharmonator_partials.txt -f220 -z1 -y1 -o1 {input} {output}",
]
output_ext = "wav"
tolerance = { kind = "sample", max_abs_error = 0.01 }
notes = "-z1/-y1/-o1 explicitly set the partial-number/decibel/delay-scale data modifiers to usage()'s own documented defaults (1/1/1) - the real C leaves these uninitialized unless passed (a real, severe bug - see pvc-core::tools::inharmonator's doc comment), so a golden case that omitted them would compare against undefined stack-garbage-driven behavior instead of anything meaningful. -R/-O/-g/-k (shifters, documented default 0) are left at the port's own matching CLI defaults. Uses a fixture with a 0.1s fade-out (sine440_2s_faded_44k.wav), not the plain sine440_2s_44k.wav other tools share: an abruptly-truncated sine drove the real oracle's own phase-vocoder+oscillator-bank resynthesis into a highly sensitive near-EOF transient (samples right where real signal meets the tool's own trailing silence hops) where tiny floating-point path differences in near-degenerate-magnitude bins compound into an audible-scale divergence - confirmed by direct A/B testing during development (the same partials/flags against the abrupt fixture measured up to 0.28 max abs error concentrated entirely in the last ~1-2% of samples; against the faded fixture, max abs error is 0.0042 - confined to the analysis window's own startup transient, well under 0.0012 everywhere else). Not a correctness bug in the port - verified via per-bin/per-frame comparison at steady state (exact match) and mid-file sample ratios (0.997-1.0006) - just a fixture choice that avoids an input discontinuity neither implementation is expected to track identically. Investigated a slow/looping ASan build under the (original, non-faded) input during development: the real (non-instrumented) release binary completes in well under a second and produces sensible output, so that is treated as an unrelated ASan-runtime-only artifact, not a real correctness bug - not reproduced, and not blocking this golden case (recorded from the plain release build, matching this project's own oracle-recording convention)."
