tool = "pvanalysis"
input = "sine440_2s_44k.wav"
description = "plain analysis file, default params"
legacy_steps = [
    "pvanalysis -N1024 {input} {output}",
]
output_ext = "pva"
tolerance = { kind = "exact" }
notes = "Compared by rust/crates/pvc-cli/tests/golden_pvanalysis.rs, not compare.py: pvc analyze only ever writes the new PVA1 format, which never byte-matches this legacy file layout by design (plan §8.1.3), so the `exact` tolerance kind here is a placeholder, not read by the actual comparator. That test reads both files via pvc-io (read_legacy_pva/read_pva), requires N/D/R/chans/frame-count to match exactly, and compares frame content with a small tolerance (magnitude always; frequency only for non-negligible-magnitude bins, since a near-silent bin's frequency estimate is dominated by floating-point noise in both the C and the port)."
