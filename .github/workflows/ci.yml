name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  legacy-build:
    name: legacy-build (CMake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libsndfile1-dev

      - name: Configure
        run: cmake -S legacy -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/pvc-legacy"

      - name: Verify tool count
        run: |
          count=$(find "${{ runner.temp }}/pvc-legacy/bin" -maxdepth 1 -type f | wc -l)
          echo "Installed $count binaries"
          test "$count" -eq 53

  docker:
    name: docker buildx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build runtime image (amd64 + arm64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build dev image (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

  golden:
    name: golden harness (C oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build + fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libsndfile1-dev sox libsox-fmt-all

      - name: Run every golden case against the legacy tools
        run: bash tests/golden/run_legacy.sh

      - name: Upload recorded expected/ (for inspection)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-expected
          path: tests/golden/expected/
          retention-days: 14

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build pvc (release)
        run: cargo build --release -p pvc-cli
        working-directory: rust

      - name: Compare pvc pv output against the C oracle (Task 3.2)
        run: cargo test --release -p pvc-cli --test golden_plainpv -- --nocapture
        working-directory: rust

      - name: Compare pvc analyze output against the C oracle (Task 3.3)
        run: cargo test --release -p pvc-cli --test golden_pvanalysis -- --nocapture
        working-directory: rust

      - name: Compare pvc twarp output against the C oracle (Task 3.4)
        run: cargo test --release -p pvc-cli --test golden_twarp -- --nocapture
        working-directory: rust

      - name: Compare pvc fn response output against the C oracle (Task 3.5)
        run: cargo test --release -p pvc-cli --test golden_response -- --nocapture
        working-directory: rust

      - name: Compare pvc freqresponse output against the C oracle (Task 3.5)
        run: cargo test --release -p pvc-cli --test golden_freqresponse -- --nocapture
        working-directory: rust

      - name: Compare pvc filter output against the C oracle (Task 3.8)
        run: cargo test --release -p pvc-cli --test golden_filter -- --nocapture
        working-directory: rust

      - name: Compare pvc denoise output against the C oracle (Task 3.6)
        run: cargo test --release -p pvc-cli --test golden_noisefilter -- --nocapture
        working-directory: rust

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flac

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
