name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build and push GHCR images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push runtime image (pvc + legacy tools)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mjladd/pvcplus:latest
            ghcr.io/mjladd/pvcplus:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build and push legacy-only image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: legacy-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mjladd/pvcplus:legacy
          cache-from: type=gha,scope=legacy-runtime
          cache-to: type=gha,mode=max,scope=legacy-runtime
